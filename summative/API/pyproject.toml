[project]
name = "kenya-maize-risk-api"
version = "0.1.0"
description = "FastAPI service that predicts Kenyan smallholder maize yield and a farm risk band for insurers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.165.0",
    "joblib==1.6.0",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "pydantic==2.14.4",
    "python-multipart==0.0.34",
    "scikit-learn==1.9.1",
    "uvicorn==0.54.0",
]
