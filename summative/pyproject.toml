[project]
name = "kenya-maize-risk-notebook"
version = "0.1.0"
description = "Regression models for Kenyan smallholder maize yield, used to score farm risk for insurers."
readme = "../README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ipykernel==7.4.0",
    "joblib==1.6.0",
    "jupyterlab==4.6.6",
    "matplotlib==3.11.2",
    "numpy==2.5.5",
    "pandas==3.1.1",
    "scikit-learn==1.9.1",
    "seaborn==0.13.2",
]
